<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Виды деятельности в сети Интернет · 9 класс</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --text-muted: #71717a;
    --text-soft: #52525b;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --accent-hover: #1d4ed8;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --error: #dc2626;
    --error-soft: #fee2e2;
    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 4px 16px rgba(0,0,0,0.06);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  #app {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px 24px;
    gap: 12px;
  }
  .header-title {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .progress-wrap {
    flex: 1;
    max-width: 240px;
    height: 6px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
  }
  .card h1 {
    font-size: 28px;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    font-weight: 600;
  }
  .card h2 {
    font-size: 20px;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    font-weight: 600;
  }
  .card p {
    margin: 0 0 12px;
    color: var(--text-soft);
  }
  .card p:last-child { margin-bottom: 0; }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 44px;
  }
  .btn:focus-visible {
    outline: 3px solid var(--accent-soft);
    outline-offset: 2px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:disabled {
    background: var(--border-strong);
    cursor: not-allowed;
    color: var(--text-muted);
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-secondary:hover { background: var(--surface-2); }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .question-num {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 18px;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    width: 100%;
    min-height: 44px;
  }
  .option:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .option:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .option.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option.correct {
    border-color: var(--success);
    background: var(--success-soft);
  }
  .option.incorrect {
    border-color: var(--error);
    background: var(--error-soft);
  }
  .option-radio {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .option.selected .option-radio {
    border-color: var(--accent);
    background: var(--accent);
  }
  .option.selected .option-radio::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
  }
  .option-text { flex: 1; }

  .option-check {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--border-strong);
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .option.selected .option-check {
    border-color: var(--accent);
    background: var(--accent);
  }
  .option.selected .option-check::after {
    content: '✓';
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }

  .text-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s ease;
    min-height: 44px;
  }
  .text-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea.text-input {
    resize: vertical;
    min-height: 88px;
    line-height: 1.5;
  }

  .fill-text {
    font-size: 15px;
    line-height: 2.2;
    color: var(--text);
  }
  .blank-input {
    display: inline-block;
    width: 140px;
    padding: 4px 10px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 15px;
    background: var(--surface);
    color: var(--text);
    text-align: center;
    vertical-align: baseline;
    margin: 0 2px;
    transition: all 0.15s ease;
  }
  .blank-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .blank-input.correct {
    border-color: var(--success);
    background: var(--success-soft);
  }
  .blank-input.incorrect {
    border-color: var(--error);
    background: var(--error-soft);
  }

  .matching {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 560px) {
    .matching { grid-template-columns: 1fr; }
  }
  .match-col { display: flex; flex-direction: column; gap: 8px; }
  .match-col-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 4px;
    padding: 0 4px;
  }
  .match-item {
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s ease;
    min-height: 44px;
    display: flex;
    align-items: center;
  }
  .match-item:hover { border-color: var(--border-strong); }
  .match-item.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .match-item.paired {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .match-item.correct {
    border-color: var(--success);
    background: var(--success-soft);
  }
  .match-item.incorrect {
    border-color: var(--error);
    background: var(--error-soft);
  }

  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.success {
    background: var(--success-soft);
    color: var(--success);
  }
  .feedback.error {
    background: var(--error-soft);
    color: var(--error);
  }

  .theory-block {
    padding: 18px 20px;
    background: var(--surface-2);
    border-radius: var(--radius);
    margin-bottom: 12px;
  }
  .theory-block h3 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
  }
  .theory-block p {
    margin: 0 0 8px;
    font-size: 14px;
    color: var(--text-soft);
  }
  .theory-block ul {
    margin: 6px 0 0;
    padding-left: 20px;
    font-size: 14px;
    color: var(--text-soft);
  }
  .theory-block li { margin-bottom: 4px; }

  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 8px auto 20px;
    border: 3px solid var(--accent);
  }
  .score-num {
    font-size: 40px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .score-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: -2px;
  }
  .result-msg {
    text-align: center;
    font-size: 16px;
    color: var(--text-soft);
    margin-bottom: 20px;
  }

  .start-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin: 18px 0;
  }
  .meta-item {
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: var(--radius);
  }
  .meta-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .meta-value {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }

  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 600;
    margin: 24px 0 12px;
    padding: 0 4px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.3s ease; }

  .hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
    font-style: italic;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Константы: вопросы, теория, задания
const SCREENS = {
  START: 'start',
  REPEAT: 'repeat',
  THEORY: 'theory',
  PRACTICE: 'practice',
  RESULTS: 'results'
};

const REPEAT_QUESTIONS = [
  {
    id: 'r1',
    type: 'choice',
    text: 'Что такое информационная безопасность?',
    options: [
      'Состояние защищённости информации и интересов пользователей от различных угроз',
      'Скорость работы компьютера в сети',
      'Способ подключения к Интернету',
      'Тип операционной системы'
    ],
    correct: 0,
    explanation: 'Информационная безопасность — это защищённость информации и интересов от угроз.'
  },
  {
    id: 'r2',
    type: 'multi',
    text: 'Какие опасности существуют в сети Интернет? (выберите все верные)',
    options: [
      'Компьютерные вирусы',
      'Фишинг — кража персональных данных',
      'Печатные книги',
      'Кибербуллинг (травля в сети)',
      'Программное обеспечение'
    ],
    correct: [0, 1, 3],
    explanation: 'Вирусы, фишинг и кибербуллинг — реальные угрозы в сети.'
  },
  {
    id: 'r3',
    type: 'choice',
    text: 'Как можно защитить себя в сети?',
    options: [
      'Использовать простые пароли вроде «12345»',
      'Сообщать пароль друзьям',
      'Использовать сложные пароли, двухфакторную аутентификацию и антивирус',
      'Переходить по всем ссылкам в письмах'
    ],
    correct: 2,
    explanation: 'Сложные пароли, 2FA и антивирус — основа защиты.'
  },
  {
    id: 'r4',
    type: 'choice',
    text: 'Как защитить свою веб-страницу?',
    options: [
      'Опубликовать пароль от неё в открытом доступе',
      'Использовать HTTPS, надёжные пароли администратора и регулярные резервные копии',
      'Никогда не обновлять CMS',
      'Не использовать защиту вообще'
    ],
    correct: 1,
    explanation: 'HTTPS, надёжные пароли и резервные копии — ключевые меры защиты сайта.'
  }
];

const THEORY = [
  {
    title: '1. Коммуникативная деятельность',
    text: 'Общение людей с помощью сетевых средств.',
    examples: [
      'Электронная почта (e-mail)',
      'Мессенджеры (Telegram, WhatsApp)',
      'Социальные сети (ВКонтакте, Одноклассники)',
      'Видеосвязь (Zoom, Skype)'
    ],
    feature: 'Позволяет общаться на расстоянии мгновенно и практически бесплатно.'
  },
  {
    title: '2. Досуговая деятельность',
    text: 'Отдых и развлечения в сети.',
    examples: [
      'Онлайн-игры (в том числе киберспортивные дисциплины)',
      'Прослушивание музыки и просмотр фильмов',
      'Чтение художественной литературы',
      'Хобби-сообщества и форумы'
    ],
    feature: 'Интернет стал одной из главных площадок для отдыха и развлечений.'
  },
  {
    title: '3. Познавательная деятельность',
    text: 'Поиск и получение новых знаний.',
    examples: [
      'Онлайн-курсы и видеолекции (Университетская школа, Stepik)',
      'Электронные энциклопедии и библиотеки',
      'Поисковые системы (Яндекс, Google)',
      'Образовательные платформы'
    ],
    feature: 'Делает знания доступными в любое время и в любом месте.'
  },
  {
    title: '4. Деятельность, связанная с функционированием сети Интернет',
    text: 'Работа, обеспечивающая функционирование самого Интернета.',
    examples: [
      'Администрирование серверов и сетей',
      'Хостинг сайтов и облачные сервисы',
      'Разработка сайтов и приложений',
      'Поддержка каналов связи'
    ],
    feature: 'Без этих специалистов Интернет просто не смог бы работать.'
  },
  {
    title: '5. Киберспорт',
    text: 'Соревновательная деятельность по компьютерным играм.',
    examples: [
      'Командные дисциплины: Dota 2, Counter-Strike 2',
      'Индивидуальные: StarCraft, Hearthstone',
      'Турниры с крупными призовыми фондами',
      'Официальные спортивные звания в России'
    ],
    feature: 'Киберспорт — это официальная спортивная дисциплина, требующая тренировки, стратегии и командной работы.'
  }
];

const PRACTICE_QUESTIONS = [
  {
    id: 'p1',
    type: 'choice',
    text: 'К какому виду деятельности в сети относится использование электронной почты для отправки письма учителю?',
    options: [
      'Досуговая деятельность',
      'Коммуникативная деятельность',
      'Познавательная деятельность',
      'Деятельность по функционированию сети'
    ],
    correct: 1,
    explanation: 'Переписка по e-mail — это общение, то есть коммуникативная деятельность.'
  },
  {
    id: 'p2',
    type: 'matching',
    text: 'Сопоставьте вид деятельности и пример:',
    pairs: [
      { left: 'Коммуникативная', right: 'Видеозвонок по Skype' },
      { left: 'Досуговая', right: 'Онлайн-игра' },
      { left: 'Познавательная', right: 'Онлайн-курс на Stepik' },
      { left: 'Функционирование сети', right: 'Администрирование сервера' }
    ]
  },
  {
    id: 'p3',
    type: 'fill',
    text: 'Заполните пропуски в определении киберспорта:',
    template: [
      { type: 'text', value: 'Киберспорт — это ' },
      { type: 'blank', answer: 'соревновательная', alt: ['соревнования'] },
      { type: 'text', value: ' деятельность по ' },
      { type: 'blank', answer: 'компьютерным', alt: ['компьютерные'] },
      { type: 'text', value: ' играм.' }
    ]
  },
  {
    id: 'p4',
    type: 'input',
    text: 'Приведите один пример познавательной деятельности в сети Интернет (коротко, 2–5 слов):',
    keywords: ['курс', 'энциклопед', 'библиотек', 'википед', 'лекци', 'урок', 'stepik', 'учеб', 'образов', 'словар', 'реферат', 'поиск'],
    explanation: 'Примеры: онлайн-курс, электронная энциклопедия, видеолекция и т.п.'
  },
  {
    id: 'p5',
    type: 'choice',
    text: 'Что из перечисленного относится к деятельности, связанной с функционированием сети Интернет?',
    options: [
      'Просмотр фильма онлайн',
      'Общение в мессенджере',
      'Администрирование сервера',
      'Прохождение онлайн-курса'
    ],
    correct: 2,
    explanation: 'Администрирование сервера обеспечивает работу самой сети.'
  }
];

// State
const state = {
  screen: SCREENS.START,
  currentQ: 0,
  repeatAnswers: {},
  repeatChecked: {},
  practiceAnswers: {},
  practiceChecked: {},
  score: 0,
  total: 0,
  repeatScore: 0,
  practiceScore: 0,
  _activeLeft: undefined
};

// Render
const app = document.getElementById('app');

function render() {
  const progress = getProgress();

  let html = `
    <header class="header">
      <div class="header-title">Информатика · 9 класс</div>
      <div class="progress-wrap" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width:${progress}%"></div>
      </div>
    </header>
  `;

  switch (state.screen) {
    case SCREENS.START: html += renderStart(); break;
    case SCREENS.REPEAT: html += renderRepeat(); break;
    case SCREENS.THEORY: html += renderTheory(); break;
    case SCREENS.PRACTICE: html += renderPractice(); break;
    case SCREENS.RESULTS: html += renderResults(); break;
  }

  app.innerHTML = html;
  attachHandlers();
}

function getProgress() {
  const map = {
    [SCREENS.START]: 0,
    [SCREENS.REPEAT]: 25,
    [SCREENS.THEORY]: 50,
    [SCREENS.PRACTICE]: 75,
    [SCREENS.RESULTS]: 100
  };
  return map[state.screen] || 0;
}

function renderStart() {
  return `
    <div class="card fade-in">
      <span class="badge">Интерактивный рабочий лист</span>
      <h1>Виды деятельности в сети Интернет</h1>
      <p>Повторим информационную безопасность, изучим основные виды деятельности в сети и закрепим материал заданиями.</p>
      <div class="start-meta">
        <div class="meta-item">
          <div class="meta-label">Класс</div>
          <div class="meta-value">9</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Предмет</div>
          <div class="meta-value">Информатика</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Заданий</div>
          <div class="meta-value">4 + 5</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Урок</div>
          <div class="meta-value">№ 1 по теме</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="start">Начать урок →</button>
      </div>
    </div>
  `;
}

function renderRepeat() {
  const q = REPEAT_QUESTIONS[state.currentQ];
  const checked = state.repeatChecked[q.id];
  const userAns = state.repeatAnswers[q.id];

  let optionsHtml = '';
  if (q.type === 'choice') {
    optionsHtml = q.options.map((opt, i) => {
      let cls = 'option';
      if (checked) {
        if (i === q.correct) cls += ' correct';
        else if (userAns === i) cls += ' incorrect';
      } else if (userAns === i) {
        cls += ' selected';
      }
      return `
        <button class="${cls}" data-action="select-repeat" data-idx="${i}" ${checked ? 'disabled' : ''}>
          <span class="option-radio"></span>
          <span class="option-text">${escapeHtml(opt)}</span>
        </button>
      `;
    }).join('');
  } else if (q.type === 'multi') {
    const selected = userAns || [];
    optionsHtml = q.options.map((opt, i) => {
      let cls = 'option';
      const isSel = selected.includes(i);
      if (checked) {
        const isCorrect = q.correct.includes(i);
        if (isCorrect) cls += ' correct';
        else if (isSel) cls += ' incorrect';
      } else if (isSel) {
        cls += ' selected';
      }
      return `
        <button class="${cls}" data-action="toggle-repeat" data-idx="${i}" ${checked ? 'disabled' : ''}>
          <span class="option-check"></span>
          <span class="option-text">${escapeHtml(opt)}</span>
        </button>
      `;
    }).join('');
  }

  let feedbackHtml = '';
  if (checked) {
    const isCorrect = checkRepeatAnswer(q);
    feedbackHtml = `
      <div class="feedback show ${isCorrect ? 'success' : 'error'}">
        ${isCorrect ? '✓ Верно!' : '✗ Не совсем.'} ${escapeHtml(q.explanation)}
      </div>
    `;
  }

  const isLast = state.currentQ === REPEAT_QUESTIONS.length - 1;
  const canNext = userAns !== undefined && userAns !== null && (q.type !== 'multi' || (Array.isArray(userAns) && userAns.length > 0));

  return `
    <div class="section-title">Повторение · Информационная безопасность</div>
    <div class="card fade-in">
      <div class="question-num">Вопрос ${state.currentQ + 1} из ${REPEAT_QUESTIONS.length}</div>
      <div class="question-text">${escapeHtml(q.text)}</div>
      ${q.type === 'multi' ? '<div class="hint">Можно выбрать несколько вариантов</div>' : ''}
      <div class="options">${optionsHtml}</div>
      ${feedbackHtml}
      <div class="btn-row">
        ${!checked ? `
          <button class="btn btn-primary" data-action="check-repeat" ${!canNext ? 'disabled' : ''}>Проверить</button>
        ` : `
          <button class="btn btn-primary" data-action="${isLast ? 'go-theory' : 'next-repeat'}">
            ${isLast ? 'К теории →' : 'Далее →'}
          </button>
        `}
      </div>
    </div>
  `;
}

function renderTheory() {
  const blocks = THEORY.map(t => `
    <div class="theory-block">
      <h3>${escapeHtml(t.title)}</h3>
      <p>${escapeHtml(t.text)}</p>
      <ul>
        ${t.examples.map(e => `<li>${escapeHtml(e)}</li>`).join('')}
      </ul>
      <p style="margin-top:10px;"><strong>Особенность:</strong> ${escapeHtml(t.feature)}</p>
    </div>
  `).join('');

  return `
    <div class="section-title">Теоретический блок</div>
    <div class="card fade-in">
      <span class="badge">Изучите перед заданиями</span>
      <h2>Виды деятельности в сети Интернет</h2>
      <p>Интернет используется людьми для разных целей. Учёные выделяют несколько основных видов деятельности в сети.</p>
      ${blocks}
      <div class="btn-row">
        <button class="btn btn-primary" data-action="go-practice">Перейти к заданиям →</button>
      </div>
    </div>
  `;
}

function renderPractice() {
  const q = PRACTICE_QUESTIONS[state.currentQ];
  let body = '';

  if (q.type === 'choice') {
    body = renderPracticeChoice(q);
  } else if (q.type === 'matching') {
    body = renderPracticeMatching(q);
  } else if (q.type === 'fill') {
    body = renderPracticeFill(q);
  } else if (q.type === 'input') {
    body = renderPracticeInput(q);
  }

  const isLast = state.currentQ === PRACTICE_QUESTIONS.length - 1;
  const checked = state.practiceChecked[q.id];
  const canNext = hasPracticeAnswer(q);

  return `
    <div class="section-title">Закрепление · ${state.currentQ + 1} из ${PRACTICE_QUESTIONS.length}</div>
    <div class="card fade-in">
      <div class="question-num">Задание ${state.currentQ + 1}</div>
      <div class="question-text">${escapeHtml(q.text)}</div>
      ${body}
      <div class="btn-row">
        ${!checked ? `
          <button class="btn btn-primary" data-action="check-practice" ${!canNext ? 'disabled' : ''}>Проверить</button>
        ` : `
          <button class="btn btn-primary" data-action="${isLast ? 'go-results' : 'next-practice'}">
            ${isLast ? 'Показать результат →' : 'Далее →'}
          </button>
        `}
      </div>
    </div>
  `;
}

function renderPracticeChoice(q) {
  const checked = state.practiceChecked[q.id];
  const userAns = state.practiceAnswers[q.id];
  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'option';
    if (checked) {
      if (i === q.correct) cls += ' correct';
      else if (userAns === i) cls += ' incorrect';
    } else if (userAns === i) {
      cls += ' selected';
    }
    return `
      <button class="${cls}" data-action="select-practice" data-idx="${i}" ${checked ? 'disabled' : ''}>
        <span class="option-radio"></span>
        <span class="option-text">${escapeHtml(opt)}</span>
      </button>
    `;
  }).join('');

  let feedbackHtml = '';
  if (checked) {
    const isCorrect = userAns === q.correct;
    feedbackHtml = `
      <div class="feedback show ${isCorrect ? 'success' : 'error'}">
        ${isCorrect ? '✓ Верно!' : '✗ Неверно.'} ${escapeHtml(q.explanation || '')}
      </div>
    `;
  }

  return `<div class="options">${optionsHtml}</div>${feedbackHtml}`;
}

function renderPracticeMatching(q) {
  const checked = state.practiceChecked[q.id];
  const userPairs = state.practiceAnswers[q.id] || {};
  const rightOrder = getShuffledRight(q);

  const leftHtml = q.pairs.map((p, i) => {
    let cls = 'match-item';
    if (userPairs[i] !== undefined) cls += ' paired active';
    if (checked) {
      cls = 'match-item';
      const correctRightIdx = q.pairs.findIndex(pp => pp.left === p.left);
      const userRightIdx = userPairs[i];
      if (userRightIdx === correctRightIdx) cls += ' correct';
      else if (userRightIdx !== undefined) cls += ' incorrect';
    }
    return `<div class="${cls}" data-action="select-left" data-idx="${i}">${escapeHtml(p.left)}</div>`;
  }).join('');

  const rightHtml = rightOrder.map((p, i) => {
    const origIdx = q.pairs.indexOf(p);
    let cls = 'match-item';
    const isPaired = Object.values(userPairs).includes(origIdx);
    if (isPaired) cls += ' paired';
    if (checked) {
      cls = 'match-item';
      const leftIdx = Object.keys(userPairs).find(k => userPairs[k] === origIdx);
      if (leftIdx !== undefined) {
        if (parseInt(leftIdx) === origIdx) cls += ' correct';
        else cls += ' incorrect';
      }
    }
    return `<div class="${cls}" data-action="select-right" data-idx="${origIdx}">${escapeHtml(p.right)}</div>`;
  }).join('');

  let feedbackHtml = '';
  if (checked) {
    const correctCount = q.pairs.filter((p, i) => userPairs[i] === i).length;
    const isFull = correctCount === q.pairs.length;
    feedbackHtml = `
      <div class="feedback show ${isFull ? 'success' : 'error'}">
        ${isFull ? '✓ Все пары верны!' : `Верно: ${correctCount} из ${q.pairs.length}.`}
      </div>
    `;
  }

  const hintHtml = !checked && Object.keys(userPairs).length === 0
    ? '<div class="hint">Сначала нажмите на элемент слева, затем — на соответствующий ему справа</div>'
    : (!checked ? '<div class="hint">Нажмите на элемент слева, чтобы изменить пару</div>' : '');

  return `
    ${hintHtml}
    <div class="matching">
      <div class="match-col">
        <div class="match-col-title">Вид деятельности</div>
        ${leftHtml}
      </div>
      <div class="match-col">
        <div class="match-col-title">Пример</div>
        ${rightHtml}
      </div>
    </div>
    ${feedbackHtml}
  `;
}

const _rightShuffleCache = {};
function getShuffledRight(q) {
  if (!_rightShuffleCache[q.id]) {
    const arr = [...q.pairs];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (i * 7 + 3) % (i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    _rightShuffleCache[q.id] = arr;
  }
  return _rightShuffleCache[q.id];
}

function renderPracticeFill(q) {
  const checked = state.practiceChecked[q.id];
  const userBlanks = state.practiceAnswers[q.id] || [];

  const blankIndices = [];
  q.template.forEach((part, idx) => {
    if (part.type === 'blank') blankIndices.push(idx);
  });

  const parts = q.template.map((part, i) => {
    if (part.type === 'text') {
      return escapeHtml(part.value);
    } else {
      const val = userBlanks[i] || '';
      let cls = 'blank-input';
      if (checked) {
        const isOk = checkBlank(val, part);
        cls += isOk ? ' correct' : ' incorrect';
      }
      return `<input type="text" class="${cls}" data-action="fill-input" data-idx="${i}" value="${escapeAttr(val)}" ${checked ? 'disabled' : ''} placeholder="..." aria-label="Пропуск ${blankIndices.indexOf(i)+1}">`;
    }
  }).join('');

  let feedbackHtml = '';
  if (checked) {
    const blanks = q.template.filter(p => p.type === 'blank');
    const correctCount = blanks.filter((b) => {
      const origIdx = q.template.indexOf(b);
      return checkBlank(userBlanks[origIdx] || '', b);
    }).length;
    const isFull = correctCount === blanks.length;
    feedbackHtml = `
      <div class="feedback show ${isFull ? 'success' : 'error'}">
        ${isFull ? '✓ Все пропуски заполнены верно!' : `Верно: ${correctCount} из ${blanks.length}. Правильные ответы: ${blanks.map(b => b.answer).join(', ')}`}
      </div>
    `;
  }

  return `<div class="fill-text">${parts}</div>${feedbackHtml}`;
}

function renderPracticeInput(q) {
  const checked = state.practiceChecked[q.id];
  const val = state.practiceAnswers[q.id] || '';

  let feedbackHtml = '';
  if (checked) {
    const isOk = checkInputQuestion(q, val);
    feedbackHtml = `
      <div class="feedback show ${isOk ? 'success' : 'error'}">
        ${isOk ? '✓ Принято!' : '✗ Попробуйте сформулировать иначе.'} ${escapeHtml(q.explanation || '')}
      </div>
    `;
  }

  return `
    <textarea class="text-input" data-action="input-answer" placeholder="Ваш ответ..." ${checked ? 'disabled' : ''}>${escapeHtml(val)}</textarea>
    ${feedbackHtml}
  `;
}

function renderResults() {
  const { score, total } = state;
  const percent = total > 0 ? Math.round((score / total) * 100) : 0;
  let msg = '';
  let grade = '';
  if (percent >= 90) { msg = 'Отличный результат! Тема усвоена.'; grade = '5'; }
  else if (percent >= 75) { msg = 'Хороший результат, но есть что повторить.'; grade = '4'; }
  else if (percent >= 50) { msg = 'Неплохо, но стоит вернуться к теории.'; grade = '3'; }
  else { msg = 'Рекомендуем перечитать теорию и попробовать снова.'; grade = '2'; }

  return `
    <div class="card fade-in" style="text-align:center;">
      <span class="badge">Итоги рабочего листа</span>
      <h2>Ваш результат</h2>
      <div class="score-circle">
        <div class="score-num">${score}/${total}</div>
        <div class="score-label">${percent}%</div>
      </div>
      <div class="result-msg">${msg}</div>
      <div class="start-meta" style="text-align:left;">
        <div class="meta-item">
          <div class="meta-label">Повторение</div>
          <div class="meta-value">${state.repeatScore || 0} / ${REPEAT_QUESTIONS.length}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Закрепление</div>
          <div class="meta-value">${state.practiceScore || 0} / ${PRACTICE_QUESTIONS.length}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Рекомендуемая оценка</div>
          <div class="meta-value">${grade}</div>
        </div>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-secondary" data-action="restart">Пройти ещё раз</button>
      </div>
    </div>
  `;
}

// Handlers
function attachHandlers() {
  app.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleClick);
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.addEventListener('input', handleInput);
    }
  });
}

function handleClick(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;

  switch (action) {
    case 'start':
      state.screen = SCREENS.REPEAT;
      state.currentQ = 0;
      render();
      break;

    case 'select-repeat': {
      const q = REPEAT_QUESTIONS[state.currentQ];
      if (state.repeatChecked[q.id]) return;
      state.repeatAnswers[q.id] = parseInt(el.dataset.idx);
      render();
      break;
    }
    case 'toggle-repeat': {
      const q = REPEAT_QUESTIONS[state.currentQ];
      if (state.repeatChecked[q.id]) return;
      const idx = parseInt(el.dataset.idx);
      let sel = state.repeatAnswers[q.id] || [];
      if (sel.includes(idx)) sel = sel.filter(i => i !== idx);
      else sel = [...sel, idx];
      state.repeatAnswers[q.id] = sel;
      render();
      break;
    }
    case 'check-repeat': {
      const q = REPEAT_QUESTIONS[state.currentQ];
      state.repeatChecked[q.id] = true;
      render();
      break;
    }
    case 'next-repeat':
      state.currentQ++;
      render();
      break;
    case 'go-theory':
      state.repeatScore = REPEAT_QUESTIONS.reduce((acc, q) => acc + (checkRepeatAnswer(q) ? 1 : 0), 0);
      state.screen = SCREENS.THEORY;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    case 'go-practice':
      state.screen = SCREENS.PRACTICE;
      state.currentQ = 0;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    case 'select-practice': {
      const q = PRACTICE_QUESTIONS[state.currentQ];
      if (state.practiceChecked[q.id]) return;
      state.practiceAnswers[q.id] = parseInt(el.dataset.idx);
      render();
      break;
    }
    case 'select-left': {
      const q = PRACTICE_QUESTIONS[state.currentQ];
      if (state.practiceChecked[q.id]) return;
      const idx = parseInt(el.dataset.idx);
      state._activeLeft = idx;
      render();
      break;
    }
    case 'select-right': {
      const q = PRACTICE_QUESTIONS[state.currentQ];
      if (state.practiceChecked[q.id]) return;
      if (state._activeLeft === undefined) return;
      const rightIdx = parseInt(el.dataset.idx);
      const pairs = state.practiceAnswers[q.id] || {};
      pairs[state._activeLeft] = rightIdx;
      state.practiceAnswers[q.id] = pairs;
      state._activeLeft = undefined;
      render();
      break;
    }
    case 'check-practice': {
      const q = PRACTICE_QUESTIONS[state.currentQ];
      // Защита: если ответ неполный — не проверяем
      if (!hasPracticeAnswer(q)) return;
      state.practiceChecked[q.id] = true;
      render();
      break;
    }
    case 'next-practice':
      state.currentQ++;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'go-results':
      state.practiceScore = calcPracticeScore();
      state.score = (state.repeatScore || 0) + state.practiceScore;
      state.total = REPEAT_QUESTIONS.length + PRACTICE_QUESTIONS.length;
      state.screen = SCREENS.RESULTS;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    case 'restart':
      Object.assign(state, {
        screen: SCREENS.START,
        currentQ: 0,
        repeatAnswers: {},
        repeatChecked: {},
        practiceAnswers: {},
        practiceChecked: {},
        score: 0,
        total: 0,
        repeatScore: 0,
        practiceScore: 0,
        _activeLeft: undefined
      });
      render();
      break;
  }
}

function handleInput(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;

  if (action === 'fill-input') {
    const q = PRACTICE_QUESTIONS[state.currentQ];
    const idx = parseInt(el.dataset.idx);
    const arr = state.practiceAnswers[q.id] || [];
    arr[idx] = el.value;
    state.practiceAnswers[q.id] = arr;
    // Обновляем disabled состояние кнопки "Проверить" без полного ререндера,
    // чтобы не терять фокус на поле ввода
    updateCheckButtonState(q);
  } else if (action === 'input-answer') {
    const q = PRACTICE_QUESTIONS[state.currentQ];
    state.practiceAnswers[q.id] = el.value;
    updateCheckButtonState(q);
  }
}

// Обновляет disabled-атрибут кнопки "Проверить" в зависимости от полноты ответа
function updateCheckButtonState(q) {
  const checkBtn = app.querySelector('[data-action="check-practice"]');
  if (checkBtn) {
    checkBtn.disabled = !hasPracticeAnswer(q);
  }
}

// Проверка ответов
function checkRepeatAnswer(q) {
  const userAns = state.repeatAnswers[q.id];
  if (q.type === 'choice') return userAns === q.correct;
  if (q.type === 'multi') {
    if (!Array.isArray(userAns)) return false;
    const a = [...userAns].sort();
    const b = [...q.correct].sort();
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }
  return false;
}

function checkBlank(val, blank) {
  const v = (val || '').trim().toLowerCase().replace(/[^а-яёa-z0-9]/g, '');
  if (!v) return false;
  if (v === blank.answer.toLowerCase().replace(/[^а-яёa-z0-9]/g, '')) return true;
  if (blank.alt) {
    return blank.alt.some(a => v === a.toLowerCase().replace(/[^а-яёa-z0-9]/g, ''));
  }
  return false;
}

function checkInputQuestion(q, val) {
  const v = (val || '').trim().toLowerCase();
  if (v.length < 3) return false;
  return q.keywords.some(k => v.includes(k.toLowerCase()));
}

function hasPracticeAnswer(q) {
  const ans = state.practiceAnswers[q.id];
  if (q.type === 'choice') return ans !== undefined && ans !== null;
  if (q.type === 'matching') {
    const pairs = ans || {};
    return Object.keys(pairs).length === q.pairs.length;
  }
  if (q.type === 'fill') {
    const arr = ans || [];
    const blankIndices = [];
    q.template.forEach((part, idx) => {
      if (part.type === 'blank') blankIndices.push(idx);
    });
    return blankIndices.every(idx => (arr[idx] || '').trim().length > 0);
  }
  if (q.type === 'input') return (ans || '').trim().length >= 3;
  return false;
}

function calcPracticeScore() {
  let score = 0;
  PRACTICE_QUESTIONS.forEach(q => {
    const ans = state.practiceAnswers[q.id];
    if (q.type === 'choice') {
      if (ans === q.correct) score++;
    } else if (q.type === 'matching') {
      const pairs = ans || {};
      const correct = q.pairs.filter((p, i) => pairs[i] === i).length;
      if (correct === q.pairs.length) score++;
    } else if (q.type === 'fill') {
      const arr = ans || [];
      const blankIndices = [];
      q.template.forEach((part, idx) => {
        if (part.type === 'blank') blankIndices.push(idx);
      });
      const allOk = blankIndices.every(idx => {
        const part = q.template[idx];
        return checkBlank(arr[idx] || '', part);
      });
      if (allOk) score++;
    } else if (q.type === 'input') {
      if (checkInputQuestion(q, ans)) score++;
    }
  });
  return score;
}

// Утилиты
function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escapeAttr(str) { return escapeHtml(str); }

// Init
function init() {
  render();
}
init();
</script>
